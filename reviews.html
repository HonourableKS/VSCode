<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
<meta name="theme-color" content="#0f2a0f">
<title>Отзывы о туристических местах Пермского края</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    background: radial-gradient(circle at 20% 20%, #1a3a1a, #0f2a0f);
    color: white;
    padding: 16px;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
}

.container {
    max-width: 800px;
    margin: 0 auto;
    width: 100%;
}

.top-btn, button {
    display: block;
    text-align: center;
    padding: 14px 20px;
    border-radius: 30px;
    text-decoration: none;
    background: linear-gradient(135deg, #b8860b, #9b6f0f);
    color: white;
    border: none;
    cursor: pointer;
    font-size: 16px;
    font-weight: 500;
    transition: all 0.2s ease;
}

.top-btn {
    margin-bottom: 20px;
    background: linear-gradient(135deg, #d4941a, #b87a0f);
}

button:active, .top-btn:active {
    transform: scale(0.98);
    opacity: 0.9;
}

.form {
    background: rgba(0, 0, 0, 0.65);
    padding: 20px;
    border-radius: 20px;
    border: 1px solid rgba(255, 215, 0, 0.4);
    margin-bottom: 20px;
    backdrop-filter: blur(5px);
}

.form h2 {
    margin-bottom: 15px;
    font-size: 1.4rem;
    color: #ffdd99;
}

select, textarea {
    width: 100%;
    padding: 12px 15px;
    margin-top: 10px;
    margin-bottom: 15px;
    border: 1px solid rgba(255, 215, 0, 0.3);
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.1);
    color: white;
    font-size: 16px;
    transition: all 0.2s ease;
}

select:focus, textarea:focus {
    outline: none;
    border-color: #b8860b;
    background: rgba(255, 255, 255, 0.15);
}

select option {
    background: #1a3a1a;
    color: white;
}

textarea {
    min-height: 100px;
    resize: vertical;
    font-family: inherit;
}

.card {
    background: rgba(0, 0, 0, 0.7);
    padding: 16px;
    border-radius: 16px;
    margin-bottom: 12px;
    border: 1px solid rgba(255, 215, 0, 0.3);
    backdrop-filter: blur(3px);
    transition: all 0.2s ease;
    animation: fadeIn 0.3s ease;
}

@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(10px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.card h3 {
    color: #ffdd99;
    margin-bottom: 8px;
    font-size: 1.1rem;
    word-break: break-word;
}

.card p {
    margin: 10px 0;
    line-height: 1.5;
    word-break: break-word;
}

.title {
    color: #ffdd99;
    margin: 20px 0 15px 0;
    font-size: 1.3rem;
}

.empty-state {
    text-align: center;
    padding: 30px;
    color: rgba(255, 255, 255, 0.6);
}

.card-actions {
    margin-top: 12px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}
.edit-btn {
    background: linear-gradient(135deg, #2a6f97, #1e5a7a);
}
.delete-btn {
    background: linear-gradient(135deg, #8b0000, #6b0000);
}

@media (max-width: 480px) {
    body {
        padding: 12px;
    }
    .form {
        padding: 16px;
    }
    .card {
        padding: 14px;
    }
    .title {
        font-size: 1.2rem;
    }
    .top-btn, button {
        padding: 12px 16px;
        font-size: 15px;
    }
    .card-actions {
        flex-direction: column;
    }
    .card-actions button {
        width: 100%;
    }
}

::-webkit-scrollbar {
    width: 6px;
}
::-webkit-scrollbar-track {
    background: rgba(0, 0, 0, 0.3);
    border-radius: 3px;
}
::-webkit-scrollbar-thumb {
    background: #b8860b;
    border-radius: 3px;
}
</style>
</head>

<body>

<div class="container">

<a href="javascript:void(0)" class="top-btn" onclick="goToMain()">🏠 На главную</a>

<div class="form" id="formBlock">
    <h2>💬 Оставить отзыв</h2>

    <select id="hotel">
        <option value="Река Чусовая">Река Чусовая</option>
        <option value="Каменный город">Каменный город</option>
        <option value="Кунгурская пещера">Кунгурская пещера</option>
        <option value="Уральские горы">Уральские горы</option>
        <option value="Горнолыжные курорты">Горнолыжные курорты</option>
        <option value="Ледяная гора">Ледяная гора</option>
    </select>

    <textarea id="text" placeholder="Расскажите о вашем впечатлении... (минимум 5 символов)" maxlength="500"></textarea>

    <button onclick="saveReview()">💾 Сохранить отзыв</button>
    <button onclick="clearForm()" style="background: linear-gradient(135deg, #666, #444); margin-top: 8px;">🗑 Очистить форму</button>
</div>

<h2 class="title">📝 Все отзывы</h2>
<div id="reviews"></div>
</div>

<script>
let currentUser = null;
let editId = null;

// Список запрещённых слов (матерные слова и их вариации)
const profanityList = [
    "хуй", "хую", "хуя", "хуём", "хуе", "хуё", "пизд", "пизда", "пизде", "пизду", "пиздой",
    "бля", "блядь", "бляди", "блядью", "блядский", "ебал", "ебать", "ебу", "ебёт", "ебаный",
    "ебану", "ебанут", "ебли", "ебло", "ебуч", "ёбар", "ёбнуть", "мудила", "мудак", "мудаком",
    "мудило", "мудозвон", "гандон", "гандона", "пидор", "пидорас", "пидора", "петух", "петуха",
    "сучка", "сука", "суки", "сукой", "шлюха", "шлюхой", "курва", "курвой", "проститутка",
    "жопа", "жопой", "жопе", "жопы", "говно", "говна", "говном", "дерьмо", "дерьма", "хер",
    "хера", "херня", "хрен", "хрена", "хреново", "член", "члена", "членом", "секс", "трахать",
    "трахнуть", "выебать", "вьебать", "заебать", "заебал", "доебаться", "отъебаться",
    "fuck", "shit", "bitch", "cunt", "dick", "asshole", "bastard"
];

function containsProfanity(text) {
    if (!text) return false;
    const lowerText = text.toLowerCase();
    for (let word of profanityList) {
        const regex = new RegExp(`\\b${word}\\b|${word}`, 'i');
        if (regex.test(lowerText)) {
            return true;
        }
    }
    return false;
}

function initUser() {
    try {
        const savedUser = localStorage.getItem('currentUser');
        if (savedUser) {
            currentUser = JSON.parse(savedUser);
        } else {
            currentUser = {
                fullname: "Гость",
                email: "guest@example.com"
            };
            localStorage.setItem('currentUser', JSON.stringify(currentUser));
        }
    } catch (e) {
        currentUser = {
            fullname: "Гость",
            email: "guest@example.com"
        };
    }
}

function goToMain() {
    if (confirm('Перейти на главную страницу?')) {
        window.location.href = 'index.html';
    }
}

function clearForm() {
    document.getElementById('text').value = '';
    document.getElementById('hotel').value = 'Река Чусовая';
    editId = null;
    const formTitle = document.querySelector('#formBlock h2');
    if (formTitle) formTitle.textContent = '💬 Оставить отзыв';
}

function saveReview() {
    if (!currentUser) {
        alert('❌ Пожалуйста, войдите в систему');
        return;
    }
    
    const hotel = document.getElementById('hotel').value;
    let text = document.getElementById('text').value.trim();
    
    if (!text) {
        alert('⚠️ Пожалуйста, введите текст отзыва');
        document.getElementById('text').focus();
        return;
    }
    
    if (text.length < 5) {
        alert('⚠️ Отзыв должен содержать минимум 5 символов');
        document.getElementById('text').focus();
        return;
    }
    
    if (containsProfanity(text)) {
        alert('❌ Ваш отзыв содержит недопустимые выражения. Пожалуйста, отредактируйте текст.');
        document.getElementById('text').focus();
        return;
    }
    
    try {
        let reviews = JSON.parse(localStorage.getItem('reviews')) || [];
        
        if (editId) {
            const index = reviews.findIndex(r => r.id === editId);
            if (index !== -1) {
                if (reviews[index].email !== currentUser.email) {
                    alert('❌ Вы можете редактировать только свои отзывы');
                    return;
                }
                reviews[index] = {
                    ...reviews[index],
                    hotel: hotel,
                    text: text,
                    editedAt: new Date().toISOString()
                };
                alert('✅ Отзыв обновлён!');
            } else {
                alert('❌ Отзыв не найден');
                return;
            }
            editId = null;
            const formTitle = document.querySelector('#formBlock h2');
            if (formTitle) formTitle.textContent = '💬 Оставить отзыв';
        } else {
            const newReview = {
                id: Date.now(),
                user: currentUser.fullname,
                email: currentUser.email,
                hotel: hotel,
                text: text,
                createdAt: new Date().toISOString()
            };
            reviews.push(newReview);
            alert('✅ Отзыв успешно добавлен!');
        }
        
        localStorage.setItem('reviews', JSON.stringify(reviews));
        clearForm();
        load();
    } catch (e) {
        alert('❌ Произошла ошибка при сохранении отзыва');
    }
}

function editReview(review) {
    if (review.email !== currentUser.email) {
        alert('❌ Вы можете редактировать только свои отзывы');
        return;
    }
    
    document.getElementById('hotel').value = review.hotel;
    document.getElementById('text').value = review.text;
    editId = review.id;
    
    const formTitle = document.querySelector('#formBlock h2');
    if (formTitle) formTitle.textContent = '✏️ Редактирование отзыва';
    
    document.getElementById('formBlock').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function deleteReview(id, email) {
    if (email !== currentUser.email) {
        alert('❌ Вы можете удалять только свои отзывы');
        return;
    }
    
    if (confirm('⚠️ Вы уверены, что хотите удалить этот отзыв?')) {
        try {
            let reviews = JSON.parse(localStorage.getItem('reviews')) || [];
            reviews = reviews.filter(r => r.id !== id);
            localStorage.setItem('reviews', JSON.stringify(reviews));
            alert('✅ Отзыв удалён');
            load();
        } catch (e) {
            alert('❌ Ошибка при удалении');
        }
    }
}

function formatDate(dateString) {
    if (!dateString) return '';
    try {
        const date = new Date(dateString);
        return date.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short', year: 'numeric' });
    } catch (e) {
        return '';
    }
}

function escapeHtml(str) {
    if (!str) return '';
    return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
}

function load() {
    try {
        const reviews = JSON.parse(localStorage.getItem('reviews')) || [];
        const reviewDiv = document.getElementById('reviews');
        reviewDiv.innerHTML = '';
        
        if (reviews.length === 0) {
            reviewDiv.innerHTML = '<div class="empty-state">📭 Пока нет отзывов. Оставьте первый!</div>';
            return;
        }
        
        const sortedReviews = [...reviews].reverse();
        sortedReviews.forEach(r => {
            const el = document.createElement('div');
            el.className = 'card';
            
            let dateText = '';
            if (r.createdAt) {
                dateText = `<div style="color: #888; font-size: 0.8rem; margin-top: 5px;">📅 ${formatDate(r.createdAt)}</div>`;
            }
            if (r.editedAt) {
                dateText += `<div style="color: #888; font-size: 0.7rem;">(ред. ${formatDate(r.editedAt)})</div>`;
            }
            
            el.innerHTML = `
                <h3>👤 ${escapeHtml(r.user)} • ${escapeHtml(r.hotel)}</h3>
                <p>💬 ${escapeHtml(r.text)}</p>
                ${dateText}
            `;
            
            if (currentUser && r.email === currentUser.email) {
                const actionsDiv = document.createElement('div');
                actionsDiv.className = 'card-actions';
                
                const editBtn = document.createElement('button');
                editBtn.textContent = '✏️ Редактировать';
                editBtn.className = 'edit-btn';
                editBtn.onclick = () => editReview(r);
                
                const delBtn = document.createElement('button');
                delBtn.textContent = '🗑 Удалить';
                delBtn.className = 'delete-btn';
                delBtn.onclick = () => deleteReview(r.id, r.email);
                
                actionsDiv.appendChild(editBtn);
                actionsDiv.appendChild(delBtn);
                el.appendChild(actionsDiv);
            }
            
            reviewDiv.appendChild(el);
        });
    } catch (e) {
        document.getElementById('reviews').innerHTML = '<div class="empty-state">❌ Ошибка загрузки отзывов</div>';
    }
}

function init() {
    initUser();
    load();
    
    const textarea = document.getElementById('text');
    if (textarea) {
        textarea.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 150) + 'px';
        });
    }
}

init();
</script>
</body>
</html>
